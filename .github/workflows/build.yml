# Builds the watch and the iPhone apps for the simulator, taps through them on
# made-up data and takes a screenshot of every screen (artifact "screenshots").
# No signing, nothing is uploaded to Apple.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    # macos-26 has iOS and watchOS 26. On macos-15 (iOS 18, watchOS 11) the
    # watch simulator was too slow for the tests and links never reached the
    # iPhone app; GitHub's xcode-27 preview image crashed the test runner.
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Translations
        run: python3 scripts/check-i18n.py

      - name: Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Simulators
        run: |
          xcrun simctl list runtimes | grep -q watchOS || xcodebuild -downloadPlatform watchOS
          xcrun simctl list runtimes | grep -q iOS || xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes | grep -E 'watchOS|iOS'

      - name: Build the watch app
        id: watch
        run: |
          xcodebuild -project LoveAround.xcodeproj -scheme LoveAroundWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build

      - name: Build the iPhone app (the watch app inside)
        id: phone
        run: |
          xcodebuild -project LoveAround.xcodeproj -scheme LoveAround \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build

      - name: Watch UI tests on made-up data
        run: |
          udid=$(scripts/simulator.py watchOS)
          scripts/ci-sample-watch.sh build/watch-samples &
          sampler=$!
          trap 'kill $sampler 2>/dev/null || true' EXIT
          xcodebuild test -project LoveAround.xcodeproj -scheme LoveAroundWatch \
            -destination "id=$udid" -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            -only-testing:LoveAroundWatchUITests/DemoUITests -resultBundlePath build/watch-ui-tests.xcresult -quiet

      # Each app's tests and the screenshots run even if the other's tests fail.
      - name: iPhone UI tests on made-up data
        if: ${{ !cancelled() && steps.phone.outcome == 'success' }}
        run: |
          udid=$(scripts/simulator.py iOS)
          xcodebuild test -project LoveAround.xcodeproj -scheme LoveAround \
            -destination "id=$udid" -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            -only-testing:LoveAroundUITests/PhoneDemoUITests -resultBundlePath build/phone-ui-tests.xcresult -quiet

      - name: Screenshots
        if: ${{ !cancelled() && steps.watch.outcome == 'success' && steps.phone.outcome == 'success' }}
        run: |
          scripts/screenshots.sh build/Build/Products/Debug-watchsimulator/LoveAround.app shots/watch
          scripts/screenshots.sh build/Build/Products/Debug-iphonesimulator/LoveAround.app shots/phone

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-tests
          path: |
            build/*-ui-tests.xcresult
            build/watch-samples
          if-no-files-found: ignore
