# XcodeGen spec: `xcodegen generate` makes LoveAround.xcodeproj (not kept in git).
# Built only in GitHub Actions (.github/workflows/build.yml): there is no Mac here.
#
# Bundle IDs leave room for the iPhone app: it will be me.lovearound.ios, and
# the watch app, already under it, will become its companion in the same
# App Store record.
name: LoveAround

options:
  bundleIdPrefix: me.lovearound
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  QRCodeGenerator:
    url: https://github.com/fwcd/swift-qrcode-generator
    from: 2.0.0

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CY8GRX7426
    SWIFT_VERSION: "5.0"

targets:
  LoveAroundWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
      - path: i18n
        type: folder
        buildPhase: resources
    dependencies:
      - package: QRCodeGenerator
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Love Around
        # The site's languages: system parts (the Apple button, alerts) follow them too.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt, de, fr, it, pl, tr, uk, ru, id, ko, zh]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        # Only HTTPS: no export-compliance question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Watch/LoveAround.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovearound.ios.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: LoveAround
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO

  # Taps through the app in a simulator: DemoUITests on made-up data (CI),
  # LiveUITests against the server (on a Mac, see the file).
  LoveAroundWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchUITests
    dependencies:
      - target: LoveAroundWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovearound.ios.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LoveAroundWatch

schemes:
  LoveAroundWatch:
    build:
      targets:
        LoveAroundWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LoveAroundWatchUITests
