# XcodeGen spec: `xcodegen generate` makes LoveAround.xcodeproj (not kept in git),
# with Info.plist and entitlements files it writes next to the sources.
# Built in GitHub Actions (.github/workflows/build.yml) and on a Mac.
#
# The iPhone app is me.lovearound.ios; the watch app, me.lovearound.ios.watchkitapp,
# travels inside it (one App Store record) and also runs without it.
name: LoveAround

options:
  bundleIdPrefix: me.lovearound
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  QRCodeGenerator:
    url: https://github.com/fwcd/swift-qrcode-generator
    from: 2.0.0

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CY8GRX7426
    SWIFT_VERSION: "5.0"

targets:
  LoveAround:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Phone
      - path: i18n
        type: folder
        buildPhase: resources
    dependencies:
      # Embedded as the companion watch app (Embed Watch Content).
      - target: LoveAroundWatch
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: Love Around
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt, de, fr, it, pl, tr, uk, ru, id, ko, zh]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # lovearound://add/<code> (an invite) and lovearound://signin (the site's sign-in page).
        CFBundleURLTypes:
          - CFBundleURLName: me.lovearound.ios
            CFBundleURLSchemes: [lovearound]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Phone/LoveAround.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovearound.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: LoveAround
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  LoveAroundWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
      - path: i18n
        type: folder
        buildPhase: resources
    dependencies:
      - package: QRCodeGenerator
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Love Around
        # The site's languages: system parts (the Apple button, alerts) follow them too.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt, de, fr, it, pl, tr, uk, ru, id, ko, zh]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        # The iPhone app's companion, which installs and runs on its own too.
        WKCompanionAppBundleIdentifier: me.lovearound.ios
        WKRunsIndependentlyOfCompanionApp: true
        # Only HTTPS: no export-compliance question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Watch/LoveAround.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovearound.ios.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: LoveAround
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO

  # Taps through the app in a simulator: DemoUITests on made-up data (CI),
  # LiveUITests against the server (on a Mac, see the file).
  LoveAroundWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchUITests
    dependencies:
      - target: LoveAroundWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovearound.ios.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LoveAroundWatch

  # The iPhone app in a simulator: PhoneDemoUITests on made-up data (CI),
  # PhoneLiveUITests against the server (on a Mac, see the file).
  LoveAroundUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PhoneUITests
    dependencies:
      - target: LoveAround
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovearound.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LoveAround
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  LoveAround:
    build:
      targets:
        LoveAround: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LoveAroundUITests
    archive:
      config: Release

  LoveAroundWatch:
    build:
      targets:
        LoveAroundWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LoveAroundWatchUITests
