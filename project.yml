# XcodeGen spec: `xcodegen generate` makes LoveAround.xcodeproj (not kept in git),
# with Info.plist and entitlements files it writes next to the sources.
# Built in GitHub Actions (.github/workflows/build.yml) and on a Mac.
#
# The iPhone app is me.lovearound.ios; the watch app, me.lovearound.ios.watchkitapp,
# travels inside it (one App Store record) and also runs without it. So does
# me.lovearound.ios.notify, which writes a heart's notification (Notify/).
name: LoveAround

options:
  bundleIdPrefix: me.lovearound
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  QRCodeGenerator:
    url: https://github.com/fwcd/swift-qrcode-generator
    from: 2.0.0
  # «Войти через Google» on the iPhone: Google's account chooser over the app.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CY8GRX7426
    SWIFT_VERSION: "5.0"

targets:
  LoveAround:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Phone
      - path: Notify/Emoji.swift
      - path: Notify/NotifyLook.swift
      # The intents the widgets, buttons and Siri send with, and their data.
      - path: WidgetShared
      - path: i18n
        type: folder
        buildPhase: resources
    dependencies:
      # Embedded as the companion watch app (Embed Watch Content).
      - target: LoveAroundWatch
      - target: LoveAroundNotify
      - target: LoveAroundWidgets
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: Love Around
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt, de, fr, it, pl, tr, uk, ru, id, ko, zh]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # lovearound://add/<code> (an invite), lovearound://pair/<code>; and
        # Google's answer to its sign-in, at the reversed client id.
        CFBundleURLTypes:
          - CFBundleURLName: me.lovearound.ios
            CFBundleURLSchemes: [lovearound]
          - CFBundleURLName: google
            CFBundleURLSchemes: [com.googleusercontent.apps.989287714644-eltkdc86n86huc9iqvrll9tpgs9li3gq]
        # The iPhone app's OAuth client in Firebase (GoogleService-Info.plist's CLIENT_ID): public.
        GIDClientID: 989287714644-eltkdc86n86huc9iqvrll9tpgs9li3gq.apps.googleusercontent.com
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Phone/LoveAround.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Links to lovearound.me open the app once the site's
        # /.well-known/apple-app-site-association names it.
        com.apple.developer.associated-domains: ["applinks:lovearound.me"]
        # Notifications; an App Store build gets "production" when signed.
        aps-environment: development
        # The notification look, read by the extension.
        com.apple.security.application-groups: [group.me.lovearound.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovearound.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: LoveAround
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  # A heart's notification comes as a bare «♥»; this writes it the way
  # Settings → «Уведомление» says (Notify/NotificationService.swift).
  LoveAroundNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: Notify
      - path: Shared/Strings.swift
      # A heart came: the widgets' ♥ glows.
      - path: WidgetShared/WidgetData.swift
      - path: i18n
        type: folder
        buildPhase: resources
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: Love Around
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt, de, fr, it, pl, tr, uk, ru, id, ko, zh]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Notify/LoveAroundNotify.entitlements
      properties:
        com.apple.security.application-groups: [group.me.lovearound.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovearound.ios.notify
        PRODUCT_NAME: LoveAroundNotify
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  # Home screen, lock screen and StandBy widgets, and (iOS 18) Control
  # Center buttons (Widgets/). They send with the app's sign-in, kept in the
  # app group's part of the Keychain.
  LoveAroundWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: WidgetShared
      - path: Shared/Strings.swift
      - path: Shared/Palette.swift
      - path: Shared/Config.swift
      - path: Shared/Keychain.swift
      - path: i18n
        type: folder
        buildPhase: resources
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Love Around
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt, de, fr, it, pl, tr, uk, ru, id, ko, zh]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/LoveAroundWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.me.lovearound.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovearound.ios.widgets
        PRODUCT_NAME: LoveAroundWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  LoveAroundWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
      - path: WidgetShared/WidgetData.swift
      - path: i18n
        type: folder
        buildPhase: resources
    dependencies:
      - package: QRCodeGenerator
      - target: LoveAroundWatchWidgets
      - target: LoveAroundWatchNotify
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Love Around
        # The site's languages: system parts (the Apple button, alerts) follow them too.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt, de, fr, it, pl, tr, uk, ru, id, ko, zh]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        # The iPhone app's companion, which installs and runs on its own too.
        WKCompanionAppBundleIdentifier: me.lovearound.ios
        WKRunsIndependentlyOfCompanionApp: true
        # Only HTTPS: no export-compliance question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Watch/LoveAround.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Hearts come to the watch as its own notifications.
        aps-environment: development
        # The complication and the Smart Stack read the people and the glow;
        # the Keychain's shared part holds the sign-in for the buttons.
        com.apple.security.application-groups: [group.me.lovearound.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovearound.ios.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: LoveAround
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO

  # The watch face's ♥, the Smart Stack's close people and (watchOS 26)
  # Control Center buttons (WatchWidgets/).
  LoveAroundWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      - path: WidgetShared
      - path: Shared/Strings.swift
      - path: Shared/Palette.swift
      - path: Shared/Config.swift
      - path: Shared/Keychain.swift
      - path: i18n
        type: folder
        buildPhase: resources
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Love Around
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt, de, fr, it, pl, tr, uk, ru, id, ko, zh]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidgets/LoveAroundWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.me.lovearound.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovearound.ios.watchkitapp.widgets
        PRODUCT_NAME: LoveAroundWatchWidgets
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO

  # The watch's own heart notification, before it shows: the complication's
  # ♥ starts glowing (WatchNotify/).
  LoveAroundWatchNotify:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchNotify
      - path: WidgetShared/WidgetData.swift
    info:
      path: WatchNotify/Info.plist
      properties:
        CFBundleDisplayName: Love Around
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: WatchNotify/LoveAroundWatchNotify.entitlements
      properties:
        com.apple.security.application-groups: [group.me.lovearound.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovearound.ios.watchkitapp.notify
        PRODUCT_NAME: LoveAroundWatchNotify
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO

  # Taps through the app in a simulator: DemoUITests on made-up data (CI),
  # LiveUITests against the server (on a Mac, see the file).
  LoveAroundWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchUITests
    dependencies:
      - target: LoveAroundWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovearound.ios.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LoveAroundWatch

  # The iPhone app in a simulator: PhoneDemoUITests on made-up data (CI),
  # PhoneLiveUITests against the server (on a Mac, see the file).
  LoveAroundUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PhoneUITests
    dependencies:
      - target: LoveAround
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovearound.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LoveAround
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  LoveAround:
    build:
      targets:
        LoveAround: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LoveAroundUITests
    archive:
      config: Release

  LoveAroundWatch:
    build:
      targets:
        LoveAroundWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LoveAroundWatchUITests
